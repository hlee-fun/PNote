# PNote 单镜像部署（镜像内已内置 PostgreSQL + Redis + 前端 dist）
# PNote single-image deployment (PostgreSQL + Redis + frontend dist are bundled)
#   拉取镜像 start:  docker compose up -d
#   停止 stop:       docker compose down        日志 logs: docker compose logs -f pnote
#
# 生产必填 required（缺失即启动失败 startup fails）: SECRET_KEY, CORS_ORIGINS, PUBLIC_BASE_URL
#   CORS_ORIGINS: 你的域名，逗号分隔，禁止通配符 *  / your domains, comma separated, no wildcard *
#   PUBLIC_BASE_URL: **单个**规范地址 the **one** canonical URL, e.g. https://note.example.com
#     用于 feed/sitemap 绝对链接 + Host/CSRF 来源白名单 for absolute links, Host & CSRF allowlists
#     多域名写进 ALLOWED_HOSTS，写这里会启动失败 / extra domains go to ALLOWED_HOSTS, not here
#   HTTPS: COOKIE_SECURE=true, ENABLE_DOCS=false
#   反代后 behind a reverse proxy: TRUSTED_PROXY=true + PROXY_PEER=容器实际看到的代理来源 (see below)

services:
  pnote:
    image: hleefun/pnote:latest
    # image: ghcr.io/hlee-fun/pnote:latest
    container_name: pnote
    ports:
      # 只绑回环。绑 0.0.0.0 任何人可绕过反代用明文 HTTP 提交登录口令（GIT_REQUIRE_HTTPS 只管 /git/）。
      # Loopback only — 0.0.0.0 lets clients bypass the proxy and POST credentials over plain HTTP.
      - "127.0.0.1:8000:8000"   # 前端与 API 同源 frontend + API share 8000
    environment:
      # 无兜底默认值：宿主未提供时 compose 直接报错，杜绝镜像内置弱密钥。
      # No fallback: compose aborts when the host omits it, so no baked-in secret can survive.
      SECRET_KEY: "${SECRET_KEY:?必须设置 SECRET_KEY（openssl rand -hex 32）}"
      INIT_USERNAME: "${INIT_USERNAME:-admin}"
      # 仅首次建账需要；建账后启动脚本以 env -u 摘除，不再长期留在 /proc/1/environ。
      # 库里已有用户时完全忽略本项，届时可从部署文件删掉。
      # Only for the first account; dropped before the app starts. Ignored once users exist — removable.
      INIT_PASSWORD: "${INIT_PASSWORD:-}"
      DATABASE_URL: "postgresql+psycopg2://pnote:pnote@127.0.0.1:5432/pnote"
      # 内置 Redis 的口令由 start.sh 生成并持久化在数据卷（/app/data/redis/.auth），连接串自动带上。
      # 只在改接外部 Redis 时显式提供本项（届时认证由你自己管）。
      # Built-in Redis password is generated by start.sh and stored in the data volume — leave unset.
      # Provide it only when pointing at an external Redis (you then own its auth).
      # REDIS_URL: "redis://127.0.0.1:6379/0"
      FRONTEND_DIST: "/app/frontend/dist"
      CORS_ORIGINS: "${CORS_ORIGINS:?必须设置 CORS_ORIGINS（如 https://note.example.com）}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?必须设置 PUBLIC_BASE_URL（如 https://note.example.com）}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      ENABLE_DOCS: "false"
      # /.well-known/security.txt 的联系邮箱；留空该路径返回 404。
      # Contact email for /.well-known/security.txt; empty = 404.
      SECURITY_CONTACT: "${SECURITY_CONTACT:-}"
      # 采信 X-Forwarded-For / X-Forwarded-Proto。默认 true：置 false 会同时坏两件事——
      # TLS 在反代终止时 /git/ 的强制 HTTPS 恒判失败（每个访客 401），限流键与审计 IP 退化成代理地址。
      # 裸跑无代理时才显式置 false。
      # Trust forwarded headers. Keep true behind a proxy; false makes /git/ reject every TLS visitor and
      # collapses all rate limiting onto the proxy IP. Set false only when running with no proxy.
      TRUSTED_PROXY: "${TRUSTED_PROXY:-true}"
      TRUSTED_HOPS: "${TRUSTED_HOPS:-1}"
      # 填「容器看到的来源 IP」，不是 nginx proxy_pass 的目标。取法：docker logs 里 uvicorn 打出的来源，
      # 或 docker inspect 的 Gateway。nginx 在宿主机→该网络网关；同 compose 网络→钉 ipv4_address 后填它。
      # 用端口发布（上面的 127.0.0.1:8000:8000）时，容器看到的来源恒等于网络网关，而 docker-proxy 不覆写
      # 转发头。把它填进 PROXY_PEER 等于允许任何本机进程伪造客户端 IP 与 X-Forwarded-Proto：实测可绕过登录
      # 限流（连错 5 次 429 → 加个 X-Real-IP 立刻 200），也能让 /git/ 把明文当 HTTPS 而接受 Basic 凭据。
      # 要让这两项防护成立：反代与应用放进同一 compose 网络直连容器，PROXY_PEER 精确填反代容器地址（勿整段 CIDR）。
      # Value = the source IP seen INSIDE the container, not the proxy_pass target. Read it from
      # `docker logs` (uvicorn prints it) or from `docker inspect` Gateway.
      # WARNING: with published ports the source is always the network gateway, and docker-proxy does not
      # rewrite forwarding headers — trusting it lets any local process spoof the client IP and
      # X-Forwarded-Proto (verified: bypasses the login rate limit; makes /git/ accept Basic over plain HTTP).
      # Put the proxy in the same compose network and pin its exact container address here, never a whole CIDR.
      PROXY_PEER: "${PROXY_PEER:-127.0.0.1}"
      # 敏感配置（AI Key / TOTP / 同步令牌）的 Fernet 密钥。留空则由 SECRET_KEY 派生——SECRET_KEY 一泄露，
      # 攻击者既能伪造管理员会话又能解密历史密文。**首次部署就配上**，事后更换需重填这三处。
      # Fernet key for stored secrets (AI key / TOTP / sync tokens). Empty = derived from SECRET_KEY, so one
      # leak gives both admin sessions and plaintext history. Set it on the first deploy; rotating later
      # means re-entering all three.
      SECRET_ENC_KEY: "${SECRET_ENC_KEY:-}"
    volumes:
      - pnote-data:/app/data
      - pnote-uploads:/app/uploads
    restart: unless-stopped
    # 交付基线（容器内实测：PG/Redis/应用与上传、缩略图、备份均正常）：
    # ① 非 root + 禁提权 → 镜像里的 setuid 程序（su/mount/passwd）失效，切断逃逸链关键一跳；
    # ② cap_drop ALL 后只补降权与写卷所需的最小能力；③ 根文件系统只读 + tmpfs → RCE 后无处落持久化代码
    # （可写仅两个卷与 /tmp）。注意 read_only 会让 `docker cp` 进容器被拒，运维请走卷或应用接口。
    # Hardening baseline (verified in-container): non-root + no privilege escalation kills the setuid
    # helpers an escape would use; capabilities drop to the minimum needed for the uid drop and the volumes;
    # a read-only rootfs leaves an RCE nowhere persistent (only the two volumes and /tmp are writable).
    # Note: read_only also refuses `docker cp` into the container — use volumes or the app's own interfaces.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /var/run:size=16m,mode=1777
    pids_limit: 512
    mem_limit: 2g
    # 此前只限内存与进程数，CPU 无配额，单容器可打满宿主。
    # Caps memory and PIDs only; the CPU quota stops one container from saturating the host.
    cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

volumes:
  pnote-data:
  pnote-uploads:
